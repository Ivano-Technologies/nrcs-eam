<!doctype html>
<html lang="en" class="light">

  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var key = "nrcs-theme";
          var theme = localStorage.getItem(key);
          if (theme !== "light" && theme !== "dark") {
            localStorage.setItem(key, "light");
            theme = "light";
          }
          if (theme === "dark") {
            document.documentElement.classList.remove("light");
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
            document.documentElement.classList.add("light");
          }
        } catch (e) {
          document.documentElement.classList.remove("dark");
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1" />
    <title>NRCS Enterprise Asset Management System</title>
    
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#C8102E" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NRCS EAM" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="mask-icon" href="/icons/nrcs-mask.svg" color="#C8102E" />
    <meta name="msapplication-TileColor" content="#C8102E" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="description" content="Enterprise Asset Management system for Nigerian Red Cross Society" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>

</html>
