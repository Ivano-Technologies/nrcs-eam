version: 2
updates:
  # npm/pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "blue"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "09:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "security"
    ignore:
      # xlsx has no public patch — ignore until replacement is scoped
      - dependency-name: "xlsx"
        update-types: ["version-update:semver-patch"]
    groups:
      all-dependencies:
        patterns:
          - "*"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "blue"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
      - "github-actions"
